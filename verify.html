<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحقق من الشهادة — جامعة سليمان الراجحي | v1.6</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--purple:#501e8c;--purple-dark:#3a1464;--purple-light:#f0ebf8;--blue:#0a6eaa;--blue-light:#e6f3fa;--bg:#f7f5fb;--ink:#241436;--muted:#6b5a80;--border:rgba(80,30,140,.12);--gold:#a9832f;--ok:#1d6b3a;--ok-bg:#e9f7ee;--ok-bd:#9fd3b1;--bad:#8b1a1a;--bad-bg:#fdecec;--bad-bd:#f0a9a9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);direction:rtl;min-height:100%}
.topbar{background:var(--purple-dark);height:6px}
.diag{height:4px;background:linear-gradient(90deg,var(--purple-dark),var(--purple) 45%,var(--blue))}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 40px}
.card{background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 30px rgba(58,20,100,.10);overflow:hidden}
.head{padding:26px 24px 18px;text-align:center;border-bottom:1px solid var(--border);background:radial-gradient(600px 220px at 90% -20%,var(--blue-light),transparent 60%),#fff}
.head img{height:72px}
.head h1{font-size:18px;color:var(--purple-dark);margin-top:12px;font-weight:700}
.head .en{font-size:12px;color:var(--muted);direction:ltr;margin-top:2px}
.body{padding:22px 24px}
.state{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:6px;border:1px solid var(--border);background:var(--purple-light);margin-bottom:18px}
.state .ic{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;background:var(--purple)}
.state.ok{background:var(--ok-bg);border-color:var(--ok-bd)}.state.ok .ic{background:var(--ok)}
.state.bad{background:var(--bad-bg);border-color:var(--bad-bd)}.state.bad .ic{background:var(--bad)}
.state .t{font-size:16px;font-weight:700}.state.ok .t{color:var(--ok)}.state.bad .t{color:var(--bad)}
.state .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.state .s.en{direction:ltr;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
td:first-child{width:36%;color:var(--muted);font-weight:600;background:#faf8fd}
td:last-child{font-weight:700;color:var(--purple-dark)}
.name{font-size:20px !important}
.lookup{display:flex;gap:8px;margin-top:18px}
.lookup input{flex:1;font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--border);border-radius:4px;direction:ltr}
.lookup button{font:inherit;font-weight:700;padding:9px 16px;border-radius:4px;border:1px solid var(--purple);background:var(--purple);color:#fff;cursor:pointer}
.foot{padding:12px 24px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);display:flex;justify-content:space-between;background:#faf8fd}
.foot span:last-child{direction:ltr}
.spin{width:22px;height:22px;border:3px solid var(--purple-light);border-top-color:var(--purple);border-radius:50%;animation:r .8s linear infinite;display:inline-block;vertical-align:middle;margin-left:8px}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.hidden{display:none}
</style>
</head>

      <h1>خدمة التحقق من الشهادات</h1>
      <div class="en">Certificate Verification Service</div>
    </div>
    <div class="body">
      <div class="state" id="state"><div class="ic"><span class="spin"></span></div><div><div class="t">جارٍ التحقق من الشهادة…</div><div class="s">Checking the certificate register</div></div></div>
      <table id="tbl" class="hidden"><tbody></tbody></table>
      <div class="lookup">
        <input id="no" placeholder="رقم الشهادة — Certificate No." aria-label="Certificate number">
        <button onclick="go()">تحقق</button>
      </div>
    </div>
    <div class="foot"><span>الإدارة التنفيذية للاتصالات وتقنية المعلومات — جامعة سليمان الراجحي</span><span>Powered by ICTD 2026 · v1.6</span></div>
  </div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbzRE_1aEwjtYK2Pc9MjuJFz_Yh26GS7GE2YUYdSGc2Bgd9H6Pdai82zzqCnl707UA7dTQ/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setState(cls,ic,t,s){ $('state').className='state '+cls; $('state').innerHTML='<div class="ic">'+ic+'</div><div><div class="t">'+t+'</div><div class="s">'+s+'</div></div>'; }
function rows(r){
  const R=[['رقم الشهادة',r.certNo],['اسم المستفيد',r.name,'name'],['نوع الشهادة',r.type],['الجهة المُصدِرة',r.department],
    ['فترة التدريب',(r.startDate||r.endDate)?(r.startDate||'—')+' — '+(r.endDate||'—'):''],['التقييم العام',r.evaluation],['تاريخ الإصدار',r.issueDate]];
  $('tbl').querySelector('tbody').innerHTML=R.filter(x=>x[1]).map(x=>'<tr><td>'+x[0]+'</td><td class="'+(x[2]||'')+'">'+esc(x[1])+'</td></tr>').join('');
  $('tbl').classList.remove('hidden');
}
async function verify(no){
  $('tbl').classList.add('hidden');
  if(!no){ setState('','?','أدخل رقم الشهادة للتحقق','Enter a certificate number to verify'); return; }
  setState('','<span class="spin"></span>','جارٍ التحقق من الشهادة…','Checking the certificate register');
  try{
    const r=await fetch(API+'?no='+encodeURIComponent(no),{cache:'no-store'}); const j=await r.json();
    if(j.ok&&j.found){ setState('ok','✓','شهادة صحيحة وموثّقة في سجل الجامعة','Valid certificate — verified against the university register'); rows(j); }
    else setState('bad','✕','لم يُعثر على شهادة بهذا الرقم — يرجى التأكد من الرقم أو التواصل مع الجهة المُصدِرة','No certificate found with this number: '+esc(no));
  }catch(e){ setState('bad','!','تعذّر الاتصال بسجل الشهادات — حاول مرة أخرى','Could not reach the register: '+esc(e.message)); }
}
function go(){ const no=$('no').value.trim(); history.replaceState(null,'','?no='+encodeURIComponent(no)); verify(no); }
$('no').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
const q=new URLSearchParams(location.search).get('no')||''; $('no').value=q; verify(q);
</script>
